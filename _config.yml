title: Nome Sito
description: Una breve descrizione del sito, utile per i motori di ricerca.
lang: it
url: "https://gjonesit.github.io"
baseurl: "/template/"
timezone: Europe/Rome
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Endpoint del form contatti (es. Formspree, Netlify Forms, Getform)
form_action: "https://example.com/form"

collections:
  projects:
    output: true
    permalink: /progetti/:title/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: post, category: Novità }
  - scope: { path: "", type: "projects" }
    values: { layout: project, area: Generale, color: pink }

exclude: [Gemfile, Gemfile.lock, README.md, node_modules, vendor]
