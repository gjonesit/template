---
layout: page
permalink: /progetti/
title: Progetti
lead: Una selezione di lavori.
---
<div class="filters" data-filter-group>
  <button class="badge badge-active" data-filter="all">Tutti</button>
  <button class="badge" data-filter="sviluppo">Sviluppo</button>
  <button class="badge" data-filter="grafica">Grafica</button>
  <button class="badge" data-filter="formazione">Formazione</button>
</div>
<div class="grid" data-filter-items>
  {% for p in site.projects %}
    {% assign slug = p.area | slugify %}
    <a class="card card-outline anim-reveal anim-tilt bg-{{ p.color | default: 'pink' }}" data-tilt data-category="{{ slug }}" href="{{ p.url | relative_url }}">
      {% if p.image %}<img src="{{ p.image | relative_url }}" alt="" loading="lazy">{% endif %}
      <span class="badge badge-active">{{ p.area }}</span>
      <h3>{{ p.title }}</h3>
      <p>{{ p.description }}</p>
    </a>
  {% endfor %}
</div>
<p class="empty-state" hidden>Nessun progetto in questa categoria, per ora.</p>
